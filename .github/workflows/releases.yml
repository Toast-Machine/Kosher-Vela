name: Mirror Vela app releases

on:
  push:
    branches: [main, Yapchik]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'patches/**'
      - 'policy-tests/**'
      - 'integration/**'
      - '.gitattributes'
      - '.github/workflows/**'
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      key_diagnostics:
        description: Build a temporary key diagnostic APK without publishing or changing release state
        type: boolean
        default: false
      release_tag:
        description: Existing upstream release tag to use for key diagnostics
        type: string
        default: v0.5.2493
  repository_dispatch:
    types: [upstream-release]

permissions:
  contents: read

env:
  RELEASE_STATE_BRANCH: ${{ github.ref_name }}
  YAPCHIK_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && inputs.key_diagnostics && 'true' || 'false' }}
  DIAGNOSTIC_RELEASE_TAG: ${{ inputs.release_tag }}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.key_diagnostics && format('vela-key-diagnostics-{0}', github.ref_name) || 'vela-release-sync' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Test release tracking
        run: python3 -m unittest discover -s tests -v
      - name: Test Yapchik action lifecycle and dispatch
        run: python3 scripts/test_yapchik_runtime.py
      - name: Find all unprocessed app releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_FAILURES: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python3 scripts/sync.py plan

  work:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.kind }} ${{ matrix.tag }}
    env:
      RELEASE_JSON: ${{ toJSON(matrix) }}
    steps:
      - name: Checkout automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact upstream source
        if: matrix.kind == 'build'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PimpinPumpkin/Vela
          ref: ${{ matrix.sha }}
          path: upstream
          persist-credentials: false
      - name: Set up Java
        if: matrix.kind == 'build'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        if: matrix.kind == 'build'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - name: Validate Gradle wrapper
        if: matrix.kind == 'build'
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c
      - name: Set up Gradle caching
        if: matrix.kind == 'build'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Build and verify Kosher Vela with Yapchik and kashering
        if: matrix.kind == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          VELA_KEYSTORE_BASE64: ${{ secrets.VELA_KEYSTORE_BASE64 }}
          VELA_KEYSTORE_PASSWORD: ${{ secrets.VELA_KEYSTORE_PASSWORD }}
        run: python3 scripts/build.py variants
      - name: Publish with the original upstream tag and release status
        if: env.YAPCHIK_DIAGNOSTICS != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build.py publish
      - name: Record failure for delayed retry
        if: failure() && env.YAPCHIK_DIAGNOSTICS != 'true'
        run: python3 scripts/sync.py failure
      - name: Save publication or failure receipt
        if: always() && env.YAPCHIK_DIAGNOSTICS != 'true' && hashFiles('out/receipt/*.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: receipt-${{ matrix.id }}
          path: out/receipt/*.json
          retention-days: 7
          if-no-files-found: error
      - name: Save temporary diagnostic APK and source
        if: env.YAPCHIK_DIAGNOSTICS == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: key-diagnostics-${{ matrix.tag }}
          path: out/assets/*
          retention-days: 3
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/kosher-vela-release.p12"

  finish:
    needs: [plan, work]
    if: always() && needs.plan.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.key_diagnostics)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Collect successful publication receipts
        if: needs.plan.outputs.has_work == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: receipt-*
          path: receipts
      - name: Record completed releases and keep polling active
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync.py finish
